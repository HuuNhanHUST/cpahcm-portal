worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  client_max_body_size 20m; # khớp giới hạn file lớn nhất backend cho phép (tài liệu 15MB, CV 10MB)

  # Giới hạn tốc độ ở tầng Nginx — lớp phòng thủ đầu tiên trước khi request chạm tới NestJS
  # (backend đã có @nestjs/throttler riêng, đây là lớp chặn thô sơ bổ sung ở edge).
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

  upstream backend_upstream {
    server backend:3001;
  }

  upstream frontend_upstream {
    server frontend:3000;
  }

  # ---- HTTP: dùng để phục vụ ACME challenge (cấp/gia hạn SSL) + redirect còn lại sang HTTPS ----
  server {
    listen 80;
    server_name cpahcm.com.vn www.cpahcm.com.vn;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---- HTTPS ----
  server {
    listen 443 ssl;
    http2 on;
    server_name cpahcm.com.vn www.cpahcm.com.vn;

    # Đường dẫn cert sinh ra bởi certbot (chỉ tồn tại SAU KHI đã chạy cấp chứng chỉ lần đầu
    # — xem hướng dẫn "bootstrap SSL lần đầu" trong .planning/CICD_ROADMAP.md).
    ssl_certificate     /etc/letsencrypt/live/cpahcm.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cpahcm.com.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    limit_req zone=general burst=40 nodelay;

    # API + health check
    location /api/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ảnh public (job posting, service, course, post...) phục vụ tĩnh từ backend
    location /uploads/ {
      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
    }

    # Swagger docs (chỉ tồn tại khi NODE_ENV != production — xem backend/src/main.ts,
    # route sẽ trả 404 tự nhiên trên production nên để đây không phát sinh rủi ro).
    location /api/docs {
      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
    }

    # Toàn bộ phần còn lại → Next.js frontend
    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
